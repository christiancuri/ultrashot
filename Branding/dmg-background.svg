<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- DMG window background (660 x 400 pt). Finder draws the icons, 128 pt:
       UltraShot.app centered at (160, 190), the Applications link at (500, 190).
       Colors come from UltraShot/AppIcon.icon/icon.json (indigo gradient #7A5CFF -> #2E1A8C).
       Rendered by make-dmg-assets.sh with resvg + SF Pro (dmg-background.png, @2x). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBFF"/>
      <stop offset="1" stop-color="#F1EFFA"/>
    </linearGradient>
    <linearGradient id="arrow" x1="258" y1="0" x2="402" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4A33B0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <!-- Drop slots behind each icon and its Finder label. -->
  <rect x="80" y="100" width="160" height="190" rx="30" fill="#2E1A8C" fill-opacity="0.04"/>
  <rect x="420" y="100" width="160" height="190" rx="30" fill="#2E1A8C" fill-opacity="0.04"/>
  <!-- Selection-corner brackets around the app slot, the motif of the app icon. -->
  <g fill="none" stroke="#7A5CFF" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 122V104Q70 90 84 90H102"/>
    <path d="M218 90H236Q250 90 250 104V122"/>
    <path d="M250 268V286Q250 300 236 300H218"/>
    <path d="M102 300H84Q70 300 70 286V268"/>
  </g>
  <!-- Arrow from the app slot to the Applications slot. -->
  <g fill="none" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 190H392"/>
    <path d="M380 177.5L393 190L380 202.5"/>
  </g>
  <text x="330" y="350" text-anchor="middle" font-family="SF Pro, System Font" font-size="13" letter-spacing="-0.08" fill="#1D1D1F" fill-opacity="0.5">Drag UltraShot to Applications to install</text>
</svg>
